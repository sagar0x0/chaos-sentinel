global:
  resolve_timeout: 5m
  # Configure this if you have a Slack integration
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Default receiver
  receiver: 'slack-notifications'

  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s
      repeat_interval: 1h
    
    - match:
        severity: warning
      receiver: 'slack-notifications'

receivers:
- name: 'slack-notifications'
  slack_configs:
  - channel: '#alerts-warning'
    send_resolved: true
    title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    text: >-
      {{ range .Alerts }}
        *Description:* {{ .Annotations.description }}
        *Service:* {{ .Labels.service }}
        *Severity:* {{ .Labels.severity }}
      {{ end }}

- name: 'slack-critical'
  slack_configs:
  - channel: '#alerts-critical'
    send_resolved: true
    title: '🚨 [{{ .Status | toUpper }}] CRITICAL: {{ .GroupLabels.alertname }}'
    text: >-
      {{ range .Alerts }}
        *Description:* {{ .Annotations.description }}
        *Service:* {{ .Labels.service }}
        *Severity:* {{ .Labels.severity }}
        *Runbook:* {{ .Annotations.runbook_url }}
      {{ end }}
